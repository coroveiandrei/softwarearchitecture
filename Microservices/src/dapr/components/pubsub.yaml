apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: dapr-stockplacementservice
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
  - name: host
    value: "amqp://localhost:5672"
  - name: durable
    value: "true"
  - name: deletedWhenUnused
    value: "false"
  - name: autoAck
    value: "false"
  - name: reconnectWait
    value: "0"
  - name: concurrencyMode
    value: parallel
  - name: deliveryMode
    value: "2"
  - name: enableDeadLetter
    value: "true"
scopes:
  - stockplacementservice
  - taskmanagementservice
