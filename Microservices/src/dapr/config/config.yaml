apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: daprConfig
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://localhost:9411/api/v2/spans"
  resiliency:
    policies:
      retries:
        myRetryPolicy:
          maxRetries: 5
          backoff:
            duration: 100ms  # Time to wait between retries
            maxDuration: 5s   # Maximum duration to wait between retries
            factor: 2         # Exponential backoff factor
    targets:
      - name: taskmanagementservice
        retries:
          policy: myRetryPolicy